<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07020f">
<meta name="description" content="Vector Canyon — a high-speed wireframe flight game. Thread your jet through a neon canyon.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Vector Canyon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07020f; --cyan:#3cf0ff; --magenta:#ff3cac; --gold:#ffc83d; --red:#ff4a5a; --violet:#8b5cff;
  --text:#e9fbff; --dim:rgba(233,251,255,.55);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Rajdhani,system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}

/* ---- overlays ---- */
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#danger{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .08s linear;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,80,.45) 100%)}
#boostfx{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(60,240,255,.22) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#fade{position:fixed;inset:0;pointer-events:none;background:var(--bg);opacity:0;transition:opacity .28s ease}
#fade.on{opacity:1}
#scan{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;
  padding:calc(14px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl))}
.lbl{font-family:Orbitron,sans-serif;font-weight:500;font-size:10px;letter-spacing:.28em;color:var(--dim)}
.tl{position:absolute;top:calc(14px + var(--st));left:calc(16px + var(--sl))}
#score{font-family:Orbitron,sans-serif;font-weight:900;font-size:34px;line-height:1.05;letter-spacing:.02em;
  text-shadow:0 0 14px rgba(60,240,255,.65);font-variant-numeric:tabular-nums}
#combo{display:inline-block;margin-top:4px;font-family:Orbitron,sans-serif;font-weight:700;font-size:13px;
  color:var(--gold);text-shadow:0 0 10px rgba(255,200,61,.7);letter-spacing:.1em;transition:transform .15s}
#combo.bump{transform:scale(1.35)}
.tc{position:absolute;top:calc(16px + var(--st));left:50%;transform:translateX(-50%);text-align:center}
#dist{font-family:Orbitron,sans-serif;font-weight:700;font-size:15px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
#chips{margin-top:6px;display:flex;gap:6px;justify-content:center;min-height:20px}
.chip{font-family:Orbitron,sans-serif;font-size:9px;font-weight:700;letter-spacing:.18em;padding:4px 8px;border-radius:3px;
  border:1px solid currentColor;opacity:0;transform:translateY(-4px);transition:all .2s}
.chip.on{opacity:1;transform:none}
#chipLow{color:var(--magenta);box-shadow:0 0 10px rgba(255,60,172,.4) inset}
#chipBoost{color:var(--cyan);box-shadow:0 0 10px rgba(60,240,255,.4) inset}
.tr{position:absolute;top:calc(10px + var(--st));right:calc(10px + var(--sr));display:flex;gap:6px;pointer-events:auto}
.icon{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;
  border:1px solid rgba(60,240,255,.35);background:rgba(7,2,15,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.icon svg{width:18px;height:18px;stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bl{position:absolute;bottom:calc(18px + var(--sb));left:calc(18px + var(--sl))}
#speed{font-family:Orbitron,sans-serif;font-weight:900;font-size:26px;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(60,240,255,.5)}
#speedbar{width:120px;height:3px;margin-top:6px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#speedfill{height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 8px var(--cyan)}
#btnBoost{position:absolute;bottom:calc(18px + var(--sb));right:calc(18px + var(--sr));width:92px;height:92px;border-radius:50%;
  pointer-events:auto;display:grid;place-items:center;background:radial-gradient(circle,rgba(60,240,255,.12),rgba(7,2,15,.35) 70%);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .1s}
#btnBoost svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#btnBoost .trk{stroke:rgba(60,240,255,.18);stroke-width:4;fill:none}
#btnBoost .val{stroke:var(--cyan);stroke-width:4;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--cyan));transition:stroke .2s}
#btnBoost span{font-family:Orbitron,sans-serif;font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--cyan);padding-left:.2em}
#btnBoost.active{transform:scale(.93)}
#btnBoost.active .val{stroke:#fff}
#btnBoost.empty span{opacity:.4}

#stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;pointer-events:none;
  border:1px solid rgba(60,240,255,.28);opacity:0;transition:opacity .15s}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
  background:radial-gradient(circle,rgba(60,240,255,.55),rgba(60,240,255,.08) 70%);border:1px solid rgba(60,240,255,.7)}

#popups{position:fixed;left:50%;top:32%;width:0;height:0;pointer-events:none}
.pop{position:absolute;left:0;top:0;white-space:nowrap;transform:translate(-50%,-50%);font-family:Orbitron,sans-serif;
  font-weight:900;letter-spacing:.08em;animation:pop 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.pop small{display:block;text-align:center;font-size:.5em;letter-spacing:.3em;font-weight:700;opacity:.85}
.pop.ring{color:var(--gold);font-size:26px;text-shadow:0 0 16px rgba(255,200,61,.8)}
.pop.near{color:var(--magenta);font-size:22px;text-shadow:0 0 16px rgba(255,60,172,.8)}
.pop.gate{color:#7dffb0;font-size:24px;text-shadow:0 0 16px rgba(125,255,176,.8)}
.pop.info{color:var(--cyan);font-size:18px;text-shadow:0 0 16px rgba(60,240,255,.8)}
.pop.lost{color:var(--dim);font-size:14px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(.96)}}

#hint{position:fixed;left:50%;bottom:calc(22% + var(--sb));transform:translateX(-50%);text-align:center;pointer-events:none;
  font-family:Orbitron,sans-serif;font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--text);opacity:0;transition:opacity .5s}
#hint.on{opacity:.9}
#hint .hand{width:46px;height:46px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--cyan);
  box-shadow:0 0 18px rgba(60,240,255,.6);animation:swipe 1.8s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translateX(-40px)}50%{transform:translateX(40px)}}

/* ---- screens ---- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(24px + var(--st)) calc(24px + var(--sr)) calc(24px + var(--sb)) calc(24px + var(--sl))}
.screen.dim{background:radial-gradient(ellipse at center,rgba(7,2,15,.55),rgba(7,2,15,.88))}
.anim-in>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.anim-in>*:nth-child(2){animation-delay:.06s}.anim-in>*:nth-child(3){animation-delay:.12s}
.anim-in>*:nth-child(4){animation-delay:.18s}.anim-in>*:nth-child(5){animation-delay:.24s}
.anim-in>*:nth-child(6){animation-delay:.3s}.anim-in>*:nth-child(7){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

#title{justify-content:space-between;cursor:pointer}
.logo{margin-top:6vh}
.logo .k{font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.5em;color:var(--magenta);margin-bottom:14px;
  text-shadow:0 0 10px rgba(255,60,172,.8);padding-left:.5em}
.logo h1{font-family:Orbitron,sans-serif;font-weight:900;line-height:.92;letter-spacing:.06em;font-size:clamp(40px,min(13vw,15vh),96px);
  color:transparent;-webkit-text-stroke:1.5px var(--cyan);
  text-shadow:0 0 18px rgba(60,240,255,.55),0 0 42px rgba(60,240,255,.25)}
.logo h1 span{display:block;color:var(--text);-webkit-text-stroke:0;text-shadow:0 0 16px rgba(60,240,255,.9),0 0 40px rgba(139,92,255,.6)}
.logo .rule{width:min(320px,70vw);height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.logo .sub{margin-top:12px;font-weight:600;font-size:14px;letter-spacing:.35em;color:var(--dim);padding-left:.35em}
.cta{display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:4vh}
.play{position:relative;font-family:Orbitron,sans-serif;font-weight:900;font-size:18px;letter-spacing:.3em;padding:18px 40px 18px 46px;
  color:var(--bg);background:var(--cyan);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:0 0 30px rgba(60,240,255,.7);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.best{font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.25em;color:var(--gold);text-shadow:0 0 10px rgba(255,200,61,.6)}
.tips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tip{border:1px solid rgba(60,240,255,.25);background:rgba(7,2,15,.45);padding:8px 12px;border-radius:4px;
  font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--dim)}
.tip b{color:var(--text);font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:.2em;margin-right:6px}
.corner{position:absolute;top:calc(10px + var(--st));right:calc(10px + var(--sr))}

.card{width:min(420px,100%);padding:28px 24px 24px;border:1px solid rgba(60,240,255,.25);
  background:linear-gradient(180deg,rgba(20,8,40,.75),rgba(7,2,15,.85));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  display:flex;flex-direction:column;align-items:center}
.card .k{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:.45em;color:var(--red);padding-left:.45em}
.card h2{font-family:Orbitron,sans-serif;font-weight:900;font-size:40px;letter-spacing:.1em;margin:6px 0 10px;
  color:var(--red);text-shadow:0 0 22px rgba(255,74,90,.7);animation:glitch 2.4s infinite}
@keyframes glitch{0%,92%,100%{transform:none}93%{transform:translate(2px,-1px) skewX(-8deg)}95%{transform:translate(-2px,1px)}97%{transform:none}}
.card h2.paused{color:var(--cyan);text-shadow:0 0 22px rgba(60,240,255,.7);animation:none}
#finalScore{font-family:Orbitron,sans-serif;font-weight:900;font-size:54px;line-height:1;text-shadow:0 0 22px rgba(60,240,255,.6);
  font-variant-numeric:tabular-nums}
#newBest{margin-top:10px;font-family:Orbitron,sans-serif;font-size:11px;font-weight:700;letter-spacing:.3em;padding:6px 12px;color:var(--bg);
  background:var(--gold);box-shadow:0 0 20px rgba(255,200,61,.7);animation:pulse 1s infinite}
.stats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:20px 0;background:rgba(60,240,255,.15);border:1px solid rgba(60,240,255,.15)}
.stats div{background:rgba(7,2,15,.9);padding:10px 12px;text-align:left}
.stats b{display:block;font-family:Orbitron,sans-serif;font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;width:100%}
.btn{flex:1;font-family:Orbitron,sans-serif;font-weight:700;font-size:13px;letter-spacing:.2em;padding:15px 10px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn.pri{background:var(--cyan);color:var(--bg);box-shadow:0 0 22px rgba(60,240,255,.6)}
.btn.sec{background:rgba(60,240,255,.1);color:var(--cyan);outline:1px solid rgba(60,240,255,.4);outline-offset:-1px}
@media (max-height:520px){
  .logo{margin-top:0}.logo .k{margin-bottom:6px}.logo .rule{margin-top:10px}.logo .sub{margin-top:8px;font-size:12px}
  .cta{gap:10px;margin-bottom:0}.play{padding:14px 34px 14px 40px;font-size:16px}.tips{display:none}
  #popups{top:28%}#btnBoost{width:80px;height:80px}
}
</style>

<body>
<canvas id="c"></canvas>
<div id="scan"></div>
<div id="vignette"></div>
<div id="boostfx"></div>
<div id="danger"></div>

<div id="hud" class="hidden">
  <div class="tl"><div class="lbl">SCORE</div><div id="score">0</div><div id="combo">×1</div></div>
  <div class="tc"><div id="dist">0.00 KM</div>
    <div id="chips"><span id="chipLow" class="chip">LOW ×1.5</span><span id="chipBoost" class="chip">BOOST ×2</span></div></div>
  <div class="tr">
    <button class="icon btnMute" aria-label="Toggle sound"></button>
    <button class="icon" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
  </div>
  <div class="bl"><div class="lbl">KM/H</div><div id="speed">0</div><div id="speedbar"><div id="speedfill"></div></div></div>
  <button id="btnBoost" aria-label="Boost">
    <svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="44"/><circle class="val" id="boostRing" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
    <span>BOOST</span>
  </button>
</div>

<div id="stick"><div id="knob"></div></div>
<div id="popups"></div>
<div id="hint"><div class="hand"></div>DRAG TO STEER</div>

<div id="title" class="screen anim-in">
  <div class="logo">
    <div class="k">WIREFRAME FLIGHT</div>
    <h1>VECTOR<span>CANYON</span></h1>
    <div class="rule"></div>
    <div class="sub">THREAD THE NEEDLE</div>
  </div>
  <div class="cta">
    <div class="best" id="titleBest"></div>
    <button class="play" id="btnPlay">TAP TO FLY</button>
    <div class="tips">
      <div class="tip"><b>DRAG</b>STEER</div>
      <div class="tip"><b>BOOST</b>SPEED ×2 PTS</div>
      <div class="tip"><b>RINGS</b>COMBO</div>
    </div>
  </div>
  <div class="corner"><button class="icon btnMute" aria-label="Toggle sound"></button></div>
</div>

<div id="over" class="screen dim hidden">
  <div class="card anim-in">
    <div class="k">SIGNAL LOST</div>
    <h2>CRASHED</h2>
    <div class="lbl">SCORE</div>
    <div id="finalScore">0</div>
    <div id="newBest" class="hidden">NEW BEST</div>
    <div class="stats">
      <div><span class="lbl">DISTANCE</span><b id="stDist">0</b></div>
      <div><span class="lbl">BEST</span><b id="stBest">0</b></div>
      <div><span class="lbl">RINGS</span><b id="stRings">0</b></div>
      <div><span class="lbl">MAX COMBO</span><b id="stCombo">0</b></div>
      <div><span class="lbl">NEAR MISSES</span><b id="stNear">0</b></div>
      <div><span class="lbl">TOP SPEED</span><b id="stSpeed">0</b></div>
    </div>
    <div class="btns"><button class="btn sec" id="btnMenu">MENU</button><button class="btn pri" id="btnAgain">FLY AGAIN</button></div>
  </div>
</div>

<div id="pause" class="screen dim hidden">
  <div class="card anim-in">
    <div class="k" style="color:var(--cyan)">HOLDING PATTERN</div>
    <h2 class="paused">PAUSED</h2>
    <div class="btns" style="margin-top:16px"><button class="btn sec" id="btnQuit">QUIT</button><button class="btn pri" id="btnResume">RESUME</button></div>
  </div>
</div>

<div id="flash"></div>
<div id="fade"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================================
   Constants
   ========================================================================= */
const BG = 0x07020f;
const CH_LEN = 160, DS = 4, ROWS = CH_LEN / DS + 1, COLS = 49, SPAN = 100;
const VIEW = 720;
const Y_MIN = 2.6, Y_MAX = 30;
const MAX_LAT = 64, MAX_VERT = 36;
const RING_R = 4.2;
const UNIT_M = 2.5;           // metres per world unit (for display)
const KMH = 9;                // world units/s -> km/h for display

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);

/* =========================================================================
   Canyon definition (analytic — used for both rendering and collision)
   ========================================================================= */
const P = new Float64Array(8);
function reseedCanyon(seed) { const r = mulberry32(seed); for (let i = 0; i < 8; i++) P[i] = r() * Math.PI * 2; }
const diff = s => clamp(s / 9000, 0, 1);
function cx(s) {
  const a = 0.55 + 0.45 * diff(s);
  return a * (34 * Math.sin(s * 0.0042 + P[0]) + 18 * Math.sin(s * 0.0097 + P[1]) + 7 * Math.sin(s * 0.023 + P[2]));
}
function halfW(s) {
  return Math.max(8, 25 + 7 * Math.sin(s * 0.0061 + P[3]) + 3 * Math.sin(s * 0.017 + P[4]) - 9 * diff(s));
}
function terrainH(x, s) {
  const d = Math.abs(x - cx(s)) - halfW(s);
  let h = 1.1 * Math.sin(s * 0.031 + x * 0.11 + P[5]) * Math.sin(s * 0.013 - x * 0.07);
  if (d > 0) {
    const n = 2.2 * Math.sin(x * 0.23 + s * 0.11 + P[6]) + 1.6 * Math.sin(s * 0.19 - x * 0.31 + P[7]);
    let w = d * 1.6 + d * d * 0.22 + n * Math.min(1, d / 5);
    const rim = 56 + 8 * Math.sin(s * 0.009 + x * 0.02 + P[3]);
    if (w > rim) w = rim + (w - rim) * 0.06;
    h += w;
  }
  return h;
}

/* =========================================================================
   Renderer / scene
   ========================================================================= */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
let PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.setClearColor(BG);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(BG, 40, 560);
const camera = new THREE.PerspectiveCamera(70, 1, 0.3, 2600);

const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 });

class Chunk {

function updateChunks(s) {
  const k0 = Math.floor((s - 60) / CH_LEN), k1 = Math.floor((s + VIEW) / CH_LEN);
  for (const [k, ch] of chunks) {
    if (k < k0 || k > k1) { scene.remove(ch.lines, ch.mesh); chunks.delete(k); chunkPool.push(ch); }
  }
  for (let k = k0; k <= k1; k++) {

}

function makeBars(s0, bars, kind) {
  const c = cx(s0), dep = 3.4, W = 150, g = new THREE.Group(), lb = new LB();
  for (const [y0, y1] of bars) {
    lb.box(-W / 2, y0, -dep / 2, W / 2, y1, dep / 2);
    const step = 5;
    for (let x = -W / 2, k = 0; x < W / 2; x += step, k++) {
      for (const z of [-dep / 2, dep / 2]) {
        lb.seg(x, y0, z, x, y1, z);
        if (y1 - y0 < 8) lb.seg(x, k % 2 ? y0 : y1, z, x + step, k % 2 ? y1 : y0, z);

    }
    if (y1 - y0 >= 8) for (let y = y0 + 4; y < y1; y += 4) for (const z of [-dep / 2, dep / 2]) lb.seg(-W / 2, y, z, W / 2, y, z);
    g.add(occBox(W, y1 - y0, dep, 0, (y0 + y1) / 2, 0));

  g.add(lb.mesh(M.obstacle));
  // hot edge lines on the flying-side edges
  const hot = new LB();
  for (const [y0, y1] of bars) { if (y0 > 0) hot.seg(-W / 2, y0, -dep / 2 - 0.02, W / 2, y0, -dep / 2 - 0.02); if (y1 < 40) hot.seg(-W / 2, y1, -dep / 2 - 0.02, W / 2, y1, -dep / 2 - 0.02); }

}

function spawnUntil(limit) {
  while (W.nextS < limit) {

    const r = rng();

    const pSlot = d < 0.2 ? 0 : 0.05 + 0.15 * d;
    const pPillar = 0.32;
    if (r < pGate) {
      const hw2 = lerp(8, 5.2, d), hh2 = lerp(6.5, 4.4, d);
      const hx = c + (rng() * 2 - 1) * Math.max(0, hw - hw2 - 2);
      let hy = lerp(Y_MIN + hh2 + 1, Y_MAX - hh2 - 1, rng());
      hy = Math.max(hy, terrainH(hx, s) + hh2 + 1.5);
      makeGate(s, hx, hy, hw2, hh2);
    } else if (r < pGate + pSlot) {

      makeBars(s, [[-4, gy - gh], [gy + gh, 44]], 'slot');

    } else {

    const n = Math.min(6, Math.floor((gap - 90) / 22));

      const ph = rng() * Math.PI * 2, ax = rng(), ay = rng();

        const rs = s + 48 + i * 22, rc = cx(rs), rhw = halfW(rs);
        let rx = rc + Math.sin(ph + i * 0.6) * rhw * 0.45 * ax;

function readInput() {
  const k = input.keys;
  let kx = (k.has('ArrowRight') || k.has('KeyD') ? 1 : 0) - (k.has('ArrowLeft') || k.has('KeyA') ? 1 : 0);
  let ky = (k.has('ArrowUp') || k.has('KeyW') ? 1 : 0) - (k.has('ArrowDown') || k.has('KeyS') ? 1 : 0);
  const x = clamp(input.x + kx, -1, 1), y = clamp(input.y + ky, -1, 1);
  const boost = input.boostTouch || k.has('Space') || k.has('ShiftLeft') || k.has('ShiftRight');

  const curve = v => Math.sign(v) * (0.35 * Math.abs(v) + 0.65 * v * v);

}

  G.state = 'over';
  const sc = Math.floor(G.score), isBest = sc > G.best;
  if (isBest) { G.best = sc; store.set('vc_best', sc); }
  $('finalScore').textContent = fmt(sc);
  $('newBest').classList.toggle('hidden', !isBest || sc === 0);
  $('stDist').textContent = (J.s * UNIT_M / 1000).toFixed(2) + ' KM';
  $('stBest').textContent = fmt(G.best);
  $('stRings').textContent = G.rings;
  $('stCombo').textContent = '×' + G.maxCombo;
  $('stNear').textContent = G.near;
  $('stSpeed').textContent = Math.round(G.topSpeed * KMH) + ' KM/H';
  hud.classList.add('hidden');
  overEl.classList.remove('hidden'); restartAnim(overEl.firstElementChild);
}

const tapStart = e => { e.preventDefault(); e.stopPropagation(); if (G.state === 'title') startRun(); };
titleEl.addEventListener('pointerdown', tapStart);
$('btnAgain').addEventListener('click', startRun);
$('btnMenu').addEventListener('click', toTitle);
$('btnPause').addEventListener('pointerdown', e => { e.stopPropagation(); Sound.click(); pause(); });
$('btnResume').addEventListener('click', resume);
$('btnQuit').addEventListener('click', toTitle);

/* =========================================================================
   Simulation
   ========================================================================= */
function addScore(n) { G.score += n; }

function updatePlaying(dt) {
  const inp = readInput();
  // boost
  const wantBoost = inp.boost && J.energy > 0.02;
  if (wantBoost && !G.boosting) Sound.boost();
  G.boosting = wantBoost;
  if (G.boosting) J.energy = Math.max(0, J.energy - dt * 0.32);
  else J.energy = Math.min(1, J.energy + dt * 0.025);
  J.boostAmt = damp(J.boostAmt, G.boosting ? 1 : 0, 5, dt);

  const target = baseSpeed(J.s) * (1 + 0.55 * J.boostAmt);
  J.speed = damp(J.speed, target, 1.6, dt);
  G.topSpeed = Math.max(G.topSpeed, J.speed);

  J.vx = damp(J.vx, inp.x * MAX_LAT, 5.5, dt);
  J.vy = damp(J.vy, inp.y * MAX_VERT, 5.5, dt);
  const prevS = J.s;
  J.s += J.speed * dt;
  J.x += J.vx * dt;
  J.y += J.vy * dt;
  if (J.y < Y_MIN) { J.y = Y_MIN; if (J.vy < 0) J.vy *= 0.5; }
  if (J.y > Y_MAX) { J.y = Y_MAX; if (J.vy > 0) J.vy *= 0.5; }

  J.roll = damp(J.roll, -J.vx / MAX_LAT * 1.05, 7, dt);
  J.pitch = damp(J.pitch, J.vy / MAX_VERT * 0.38, 7, dt);
  J.yaw = damp(J.yaw, -Math.atan2(J.vx, J.speed) * 0.9, 7, dt);

  // scoring: distance
  G.low = J.y - terrainH(J.x, J.s) < 5.2;
  addScore((J.s - prevS) * 0.1 * (G.boosting ? 2 : 1) * (G.low ? 1.5 : 1));

  // terrain collision — body + banked wingtips
  const cr = Math.cos(J.roll), sr = Math.sin(J.roll), tip = 1.35;
  const pts = [[J.x, J.y - 0.25], [J.x + tip * cr, J.y + tip * sr], [J.x - tip * cr, J.y - tip * sr]];
  for (const [px, py] of pts) if (terrainH(px, J.s) > py + 0.1) { crash(); return; }

  // proximity (danger vignette + near-miss)
  let prox = 0;
  for (const off of [2.2, 3.4, 4.6]) {
    if (terrainH(J.x + off, J.s) > J.y || terrainH(J.x - off, J.s) > J.y) { prox = Math.max(prox, (5.2 - off) / 3); }
  }
  G.nearCD -= dt;
  if (prox > 0.6 && G.nearCD <= 0) { nearMiss(); }

  // obstacles & rings
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i];
    if (o.kind === 'ring') {
      o.spin.rotation.z += dt * 1.2;
      if (o.t >= 0) {
        o.t += dt; const k = 1 + o.t * 5; o.spin.scale.set(k, k, k); o.mat.opacity = Math.max(0, 1 - o.t / 0.35);
      } else if (prevS < o.s0 && J.s >= o.s0) {
        if (Math.hypot(J.x - o.x, J.y - o.y) < RING_R + 0.5) collectRing(o);
        else { o.t = -2; o.mat.opacity = 0.25; if (G.combo > 1) { popup('COMBO LOST', 'lost'); Sound.lost(); } G.combo = 1; }
      }
    } else {
      const ds = Math.abs(J.s - o.s0);
      if (ds < 14) {
        if (hitObj(o, J.x, J.y, J.s, 0.95)) { crash(); return; }
        if (hitObj(o, J.x, J.y, J.s, 3.4)) { o.close = true; prox = Math.max(prox, 0.7); }
      }
      if (!o.scored && J.s > o.s0 + (o.dep / 2) + 1.2) {
        o.scored = true;
        if (o.kind === 'gate') { G.gates++; addScore(150 * G.combo); popup('+' + 150 * G.combo + '<small>GATE</small>', 'gate'); Sound.gate(); vibrate(20); }
        else if (o.close) nearMiss(true);
      }
    }
    if (o.s0 < J.s - 30) { removeObj(o); objs.splice(i, 1); }
  }
  G.prox = damp(G.prox, prox, 12, dt);

  if (W.spawn) spawnUntil(J.s + VIEW);
  placeJet(G.time);
  pushTrail(trails[0], TIP_L); pushTrail(trails[1], TIP_R);

  // tutorial hint
  if (G.hintT > 0) { G.hintT -= dt; hintEl.classList.toggle('on', G.hintT > 0 && !input.dragged && G.time > 0.6); }
  else hintEl.classList.remove('on');

  Sound.engine(true, clamp((J.speed - 55) / 110, 0, 1), J.boostAmt, G.prox);
}

function nearMiss(obstacle) {
  G.near++; G.nearCD = 1.2;
  const pts = (obstacle ? 75 : 50) * G.combo;
  addScore(pts);
  popup('+' + pts + '<small>' + (obstacle ? 'CLOSE CALL' : 'NEAR MISS') + '</small>', 'near');
  Sound.near(); vibrate(15);
  G.shake = Math.max(G.shake, 0.25);
}
function collectRing(o) {
  const pts = 100 * G.combo;
  addScore(pts);
  G.rings++;
  popup('+' + pts + (G.combo > 1 ? '<small>×' + G.combo + ' COMBO</small>' : ''), 'ring');
  Sound.ring(G.combo);
  G.combo = Math.min(9, G.combo + 1); G.maxCombo = Math.max(G.maxCombo, G.combo); bumpCombo();
  J.energy = Math.min(1, J.energy + 0.2);
  o.t = 0; vibrate(10);
}

function updateAttract(dt) {
  const t = G.time;
  J.speed = damp(J.speed, 64, 1, dt);
  const ahead = J.s + 30;
  const tx = cx(ahead) + Math.sin(t * 0.45) * 5, ty = 12 + Math.sin(t * 0.33) * 5;
  J.vx = damp(J.vx, clamp((tx - J.x) * 1.4, -MAX_LAT, MAX_LAT), 3, dt);
  J.vy = damp(J.vy, clamp((ty - J.y) * 1.2, -MAX_VERT, MAX_VERT), 3, dt);
  J.s += J.speed * dt; J.x += J.vx * dt; J.y += J.vy * dt;
  J.roll = damp(J.roll, -J.vx / MAX_LAT * 1.6, 4, dt);
  J.pitch = damp(J.pitch, J.vy / MAX_VERT * 0.4, 4, dt);
  J.yaw = damp(J.yaw, -Math.atan2(J.vx, J.speed) * 0.9, 4, dt);
  placeJet(t);
  pushTrail(trails[0], TIP_L); pushTrail(trails[1], TIP_R);
}

/* ---- camera ---- */
const _look = new THREE.Vector3();
function updateCamera(dt) {
  const st = G.state;
  if (st === 'title') {
    const a = Math.sin(G.time * 0.12) * 1.1, r = 12;
    const tx = J.x + Math.sin(a) * r, ty = J.y + 2.6 + Math.sin(G.time * 0.21) * 1.2, tz = -J.s + Math.cos(a) * r;
    camera.position.x = damp(camera.position.x, tx, 2, dt);
    camera.position.y = damp(camera.position.y, ty, 2, dt);
    camera.position.z = damp(camera.position.z, tz, 6, dt);
    _look.set(J.x, J.y + 0.6, -J.s - 6);
    camera.lookAt(_look);
    camera.fov = damp(camera.fov, baseFov, 3, dt);
  } else if (st === 'dead' || st === 'over') {
    // pull back up the canyon centre-line and watch the wreck
    const p = G.crashPos, cs = J.s - 26 - G.deadT * 2;
    camera.position.x = damp(camera.position.x, lerp(p.x, cx(cs), 0.7), 1.5, dt);
    camera.position.y = damp(camera.position.y, Math.max(p.y, 10) + 7, 1.5, dt);
    camera.position.z = damp(camera.position.z, -cs, 1.5, dt);
    camera.lookAt(p);
  } else {
    const back = 10.5 + J.boostAmt * 2.4;
    camera.position.x = damp(camera.position.x, J.x - J.vx * 0.03, 5, dt);
    camera.position.y = damp(camera.position.y, J.y + 3.1 - J.vy * 0.02, 5, dt);
    camera.position.z = -J.s + back;
    _look.set(J.x + J.vx * 0.06, J.y + (camera.aspect < 1 ? 2.4 : 1.2), -J.s - 24);
    camera.lookAt(_look);
    camera.rotateZ(J.roll * 0.28);
    const sp = clamp((J.speed - 60) / 100, 0, 1);
    camera.fov = damp(camera.fov, baseFov + sp * 8 + J.boostAmt * 10, 4, dt);
  }
  if (G.shake > 0.001) {
    const k = G.shake * G.shake;
    camera.position.x += (Math.random() - 0.5) * k * 1.2;
    camera.position.y += (Math.random() - 0.5) * k * 1.2;
    camera.rotateZ((Math.random() - 0.5) * k * 0.05);
    G.shake = Math.max(0, G.shake - dt * 2.2);
  }
  camera.updateProjectionMatrix();

  // backdrop follows the camera
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  sun.position.set(camera.position.x, 95, camera.position.z - 1500);
  sunGlow.position.set(camera.position.x, 95, camera.position.z - 1510);
}

function updateStreaks(dt) {
  const len = J.speed * (0.035 + J.boostAmt * 0.05);
  const cz = camera.position.z;
  for (let i = 0; i < NS; i++) {
    if (SZ[i] > cz + 2 || SZ[i] < cz - 400) respawnStreak(i, false);
    const o = i * 6;
    streakPos[o] = SX[i]; streakPos[o + 1] = SY[i]; streakPos[o + 2] = SZ[i];
    streakPos[o + 3] = SX[i]; streakPos[o + 4] = SY[i]; streakPos[o + 5] = SZ[i] + len;
  }
  streaks.geometry.attributes.position.needsUpdate = true;
  const target = G.state === 'playing' ? 0.18 + J.boostAmt * 0.5 : G.state === 'title' ? 0.12 : 0;
  streakMat.opacity = damp(streakMat.opacity, target, 4, dt);
}

function updateEngineGlow() {
  const f = 0.85 + Math.random() * 0.3, b = J.boostAmt;
  engine.scale.setScalar((0.9 + b * 1.4) * f);
  engineCore.scale.setScalar((0.35 + b * 0.4) * f);
  engine.material.color.setRGB(lerp(1.0, 0.35, b), lerp(0.45, 0.85, b), lerp(0.2, 1.0, b));
}

/* ---- adaptive quality ---- */
const perf = { acc: 0, n: 0, t: 0, done: false };
function adaptQuality(dt) {
  if (perf.done) return;
  perf.t += dt; perf.acc += dt; perf.n++;
  if (perf.t > 2.5) {
    const avg = perf.acc / perf.n;
    if (avg > 1 / 45 && PR > 1) { PR = Math.max(1, PR - 0.5); resize(); perf.t = 0; perf.acc = 0; perf.n = 0; }
    else perf.done = true;
  }
}

/* =========================================================================
   Main loop
   ========================================================================= */
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 1 / 30);
  if (G.state !== 'paused') G.time += dt;

  if (G.state === 'playing') updatePlaying(dt);
  else if (G.state === 'title') updateAttract(dt);
  else if (G.state === 'dead' || G.state === 'over') {
    G.deadT += dt;
    if (G.state === 'dead' && G.deadT > 1.5) showGameOver();
  }
  if (G.state !== 'paused') {
    updateFX(dt);
    updateCamera(dt);
    updateStreaks(dt);
    updateEngineGlow();
    updateChunks(J.s);
    if (G.state !== 'playing') { G.prox = damp(G.prox, 0, 6, dt); J.boostAmt = damp(J.boostAmt, 0, 4, dt); }
    bloom.strength = damp(bloom.strength, 0.6 + J.boostAmt * 0.25, 2.5, dt);
  }
  if (popStackT > 0) { popStackT -= dt; if (popStackT <= 0) popStack = 0; }
  if (G.state === 'playing' || G.state === 'dead') updateHUD();
  adaptQuality(dt);
  composer.render();
}

resize();
setTitleBest();
resetWorld((Math.random() * 2 ** 31) | 0, false);
frame();
window.VC = { G, J, startRun, pause, resume, input, step: updatePlaying, objs: () => objs, cx, halfW, terrainH };
</script>
</body>
</html>

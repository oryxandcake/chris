<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grandtully Circus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0405; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #2a0a0d 0%, #0a0405 70%) no-repeat;
  }
  img {
    max-width: 100%;
    max-height: 100vh;
    display: block;
  }
  .caption {
    max-width: 760px;
    margin: 2.5rem 1.5rem 3.5rem;
    padding: 2rem 2.5rem;
    text-align: center;
    border-top: 2px solid #c9a24a;
    border-bottom: 2px solid #c9a24a;
    position: relative;
  }
  .caption::before,
  .caption::after {
    content: "\2726";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: #c9a24a;
    background: #0a0405;
    padding: 0 0.6rem;
    font-size: 1rem;
  }
  .caption::before { top: -0.7rem; }
  .caption::after  { bottom: -0.7rem; }
  .caption p {
    font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
    font-weight: 500;
    color: #f3e4bf;
    font-size: clamp(1.05rem, 2.2vw, 1.45rem);
    line-height: 1.7;
    letter-spacing: 0.03em;
    margin: 0;
    text-shadow: 0 1px 0 rgba(0,0,0,0.6);
  }
  .caption .lead {
    font-family: 'Rye', 'Cinzel', Georgia, serif;
    color: #f0c14b;
    font-size: clamp(1.4rem, 3vw, 2rem);
    display: block;
    margin-bottom: 1rem;
    letter-spacing: 0.04em;
    text-shadow:
      0 0 6px rgba(240, 193, 75, 0.25),
      0 2px 0 #6b3a0e;
  }
  .acts {
    margin-top: 1.75rem;
    font-family: 'Rye', 'Cinzel', Georgia, serif;
    color: #d9b56b;
    font-size: clamp(0.9rem, 1.8vw, 1.15rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.6;
  }
  .acts .star {
    color: #c9a24a;
    margin: 0 0.55rem;
    font-size: 0.8em;
    vertical-align: 0.15em;
  }
</style>
</head>
<body>
  <img src="GrandtullyCircus.png" alt="Grandtully Circus">
  <div class="caption">
    <p>
      <span class="lead">Step Right Up!</span>
      An Amazing Circus which will Baffle and Bamboozle you.
      You will be thrilled because you can step up onto the stage
      and do an act of your own!
    </p>
    <p class="acts">
      There are acts of<span class="star">&#10022;</span>a Floating Sun<span class="star">&#10022;</span>a Floating Wapeesh
    </p>
  </div>
</body>
</html>
